name: Tests

on:
  pull_request:
    branches:
      - master

jobs:
  testes:
    name: Testes Unitários (.NET 8)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restaurar dependências
        run: dotnet restore agenda-pics.sln

      - name: Compilar solução
        run: dotnet build agenda-pics.sln --no-restore --configuration Release

      - name: Executar testes
        run: dotnet test tests/AgendaPics.Application.Tests/AgendaPics.Application.Tests.csproj --no-build --configuration Release --verbosity normal
