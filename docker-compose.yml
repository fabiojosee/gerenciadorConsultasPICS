
volumes:
  agendapics-volume:

networks:
  frontend:
  backend:
 
services:
  agendapicsweb:
    image: ${DOCKER_REGISTRY-}agendapicsweb
    container_name: agendapicsweb
    build:
      context: .
      dockerfile: src/AgendaPics.Web/Dockerfile
    networks:
     - backend
     - frontend
    depends_on:
    - database
    ports:
    - "32033:8080"
    environment:
    - ASPNETCORE_ENVIRONMENT=Development
    - ConnectionStrings__DefaultConnection=Server=dbagendapics,1433;Database=dbAgendaPics;User Id=sa;Password=SENHA_SA;TrustServerCertificate=True;

  database:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: dbagendapics
    hostname: dbagendapics
    volumes:
     - agendapics-volume:/var/opt/mssql
    networks:
     - backend
    ports:
     - "1433:1433"
    expose:
     - 1433
    environment:
      MSSQL_SA_PASSWORD: "SENHA_SA"
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Express"